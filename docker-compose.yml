version: "3.8"

services:
  app:
    build: .
    container_name: multowood_app
    restart: unless-stopped
    env_file:
      - config/.env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./index.html:/app/index.html:ro
      - ./src:/app/src:ro
    networks:
      - multowood-net
    ports:
      - "127.0.0.1:8000:8000"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: multowood_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    env_file:
      - config/.env
    networks:
      - multowood-net
    depends_on:
      - app

networks:
  multowood-net:
    driver: bridge
